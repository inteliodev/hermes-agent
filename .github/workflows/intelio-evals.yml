name: intelio-evals

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Rubric self-test
        run: python evals/intelio_grader/grade.py --self-test

  promptfoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: "22"
      - name: Promptfoo reference replay
        working-directory: evals/intelio_grader
        run: npx --yes promptfoo@0.118.1 eval -c promptfooconfig.yaml --no-cache
